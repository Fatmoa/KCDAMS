<div class="app-content content">
  <div class="content-overlay"></div>
  <div class="content-wrapper">
    <div class="content-header row">
      <div class="content-header-left col-md-6 col-12 mb-2">
        <div class="row breadcrumbs-top">
          <div class="breadcrumb-wrapper col-12">
            <ol class="breadcrumb">
            </ol>
          </div>
        </div>
      </div>
      <div class="content-header-right col-md-6 col-12">
        <div class="btn-group float-md-right" role="group" >
        <button type="button" class="btn btn-info btn-min-width btn-glow mr-1 mb-1" (click)="onAdd()">Add</button>
        </div>
      </div>
    </div>
    <div class="content-body"><section id="invoice-summary">
<div class="card">
<div class="card-header">
  <h4 class="card-title">Patients List</h4>
  <a class="heading-elements-toggle"><i class="la la-ellipsis-h font-medium-3"></i></a>
</div>
<div class="card-content collapse show">
  <div class="card-body">

    <mat-form-field appearance="outline">
      <mat-label>Filter</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
    </mat-form-field>


      <table mat-table [dataSource]="dataSource" matSort>

        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
          <td mat-cell *matCellDef="let row; let i=index"> {{i+1}} </td>
        </ng-container>

        <!-- Progress Column -->
        <ng-container matColumnDef="des">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Deseases </th>
          <td mat-cell *matCellDef="let row"> {{row.deseas}}</td>
        </ng-container>


        <ng-container matColumnDef="Ldr">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Last used Drug </th>
          <td mat-cell *matCellDef="let row">
            <span *ngIf="row.lastDrug == '1' ">Heroin</span>
            <span *ngIf="row.lastDrug == '2' ">Cocaine</span>
            <span *ngIf="row.lastDrug == '3' ">Methadone</span>
            <span *ngIf="row.lastDrug == '4' ">Mirungi</span>
            <span *ngIf="row.lastDrug == '5' ">Valium</span>
          </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="Lus">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Last use </th>
          <td mat-cell *matCellDef="let row">
            <span *ngIf="row.lastUsg == '1' ">Ndani ya wiki</span>
            <span *ngIf="row.lastUsg == '2' ">Wiki hadi mwezi</span>
            <span *ngIf="row.lastUsg == '3' ">Zaid ya mwezi mmoja</span>

          </td>
        </ng-container>

        <ng-container matColumnDef="use">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Usage </th>
          <td mat-cell *matCellDef="let row">
            <span *ngIf="row.usag == '1' ">Kuvuta</span>
            <span *ngIf="row.usag == '2' ">Kujidunga</span>
            <span *ngIf="row.usag == '3' ">Zote</span>
        </td>
        </ng-container>


        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Action </th>
          <td mat-cell *matCellDef="let row">
            <button mat-raised-button color="primary" (click)="onEdit(row)"><i class="las la-edit">Edit</i></button>&nbsp;
            <button mat-raised-button color="primary" (click)="onView(row)"><i class="las la-eye">View</i></button>

          </td>
        </ng-container>


        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
        </tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
    </div>
</div>

</div>
</section>

    </div>
  </div>
</div>
